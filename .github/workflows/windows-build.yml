name: Windows build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build executable and installer
        run: .\build.cmd -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: DevProjectBackup-Windows
          path: |
            dist/DevProjectBackup.exe
            installer-output/DevProjectBackup-Setup-*.exe
          if-no-files-found: error
