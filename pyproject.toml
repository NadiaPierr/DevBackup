[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-project-backup"
dynamic = ["version"]
description = "Desktop application for creating and restoring local project backups."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter==5.2.2",
    "platformdirs==4.12.3",
    "pathspec==0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyinstaller==6.22.3",
]

[tool.setuptools]
package-dir = {"" = "scr"}
py-modules = ["app", "app_paths", "backup_manager", "main", "version"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}
